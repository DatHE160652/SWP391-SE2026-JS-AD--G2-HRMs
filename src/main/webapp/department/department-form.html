<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Form</title>
    <link rel="stylesheet" href="../css/employee.css">
</head>
<body data-page="department-form">
<div class="shell">
    <aside class="sidebar">
        <div class="brand">HRMs Cloud<span>TechNova JSC</span></div>
        <div class="nav-label">Phân hệ quản trị</div>
        <a class="nav-link" href="../employee/employee-list.html">Quản lý Nhân sự</a>
        <a class="nav-link active" href="department-list.html">Quản lý Phòng ban</a>
        <a class="nav-link" href="../position/position-list.html">Quản lý Chức danh</a>
        <div class="plan-card"><strong>Gói Pro SME</strong><br>UC07 Manage Departments</div>
    </aside>

    <main class="content">
        <div class="topbar">
            <div class="search-box">Department Form</div>
            <div class="today">UC07</div>
            <div class="user">HR Director / Admin</div>
        </div>

        <div class="page-header">
            <div>
                <h1 id="departmentFormTitle" class="page-title">Add Department</h1>
                <p class="page-subtitle">Create or update department information.</p>
            </div>
            <a class="button secondary" href="department-list.html">Cancel</a>
        </div>

        <div id="message" class="message"></div>

        <form id="departmentForm" class="panel">
            <input type="hidden" name="departmentId">
            <div class="form-grid">
                <div>
                    <label>Department Code</label>
                    <input name="departmentCode" required>
                </div>
                <div>
                    <label>Department Name</label>
                    <input name="departmentName" required>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit">Save</button>
                <a class="button secondary" href="department-list.html">Cancel</a>
            </div>
        </form>
    </main>
</div>
<script src="../js/department.js"></script>
</body>
</html>
