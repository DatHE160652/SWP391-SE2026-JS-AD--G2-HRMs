<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Form</title>
    <link rel="stylesheet" href="../css/employee.css">
</head>
<body data-page="position-form">
<div class="shell">
    <aside class="sidebar">
        <div class="brand">HRMs Cloud<span>TechNova JSC</span></div>
        <div class="nav-label">Phân hệ quản trị</div>
        <a class="nav-link" href="../employee/employee-list.html">Quản lý Nhân sự</a>
        <a class="nav-link" href="../department/department-list.html">Quản lý Phòng ban</a>
        <a class="nav-link active" href="position-list.html">Quản lý Chức danh</a>
        <div class="plan-card"><strong>Gói Pro SME</strong><br>UC08 Manage Positions</div>
    </aside>

    <main class="content">
        <div class="topbar">
            <div class="search-box">Position Form</div>
            <div class="today">UC08</div>
            <div class="user">HR Director / Admin</div>
        </div>

        <div class="page-header">
            <div>
                <h1 id="positionFormTitle" class="page-title">Add Position</h1>
                <p class="page-subtitle">Create or update position information.</p>
            </div>
            <a class="button secondary" href="position-list.html">Cancel</a>
        </div>

        <div id="message" class="message"></div>

        <form id="positionForm" class="panel">
            <input type="hidden" name="positionId">
            <div class="form-grid">
                <div>
                    <label>Position Title</label>
                    <input name="positionTitle" required>
                </div>
                <div>
                    <label>Description</label>
                    <textarea name="description" rows="3"></textarea>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit">Save</button>
                <a class="button secondary" href="position-list.html">Cancel</a>
            </div>
        </form>
    </main>
</div>
<script src="../js/position.js"></script>
</body>
</html>
