<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - HRMs Cloud</title>
    <link rel="stylesheet" href="../css/employee.css">
</head>
<body data-page="my-profile">
<div class="shell">
    <aside class="sidebar">
        <div class="brand">HRMs Cloud<span>Employee Portal</span></div>
        <div class="nav-label">Chức năng cá nhân</div>
        <a class="nav-link active" href="my-profile.html">Hồ sơ cá nhân</a>
        <a class="nav-link" href="../attendance/employee-attendance.html">Chấm công cá nhân</a>
        <a class="nav-link logout-link" href="../logout">Đăng xuất</a>
    </aside>

    <main class="content">
        <div class="page-header">
            <div>
                <h1 id="profileName" class="page-title">Employee Details</h1>
                <p class="page-subtitle">Mã nhân viên: <span id="profileCode">-</span></p>
            </div>
        </div>

        <div id="message" class="message"></div>

        <section class="panel">
            <div class="tabs">
                <button class="tab-button active" data-tab="profile">Personal Info</button>
                <button class="tab-button" data-tab="employment">Employment</button>
                <button class="tab-button" data-tab="salary">Salary</button>
                <button class="tab-button" data-tab="account">Account</button>
                <button class="tab-button" data-tab="documents">Documents</button>
                <button class="tab-button" data-tab="history">History</button>
            </div>

            <div id="profileTab" class="tab-panel">
                <form id="myProfileForm">
                    <div class="form-grid">
                        <div>
                            <label>Employee Code</label>
                            <input name="employeeCode" readonly>
                        </div>
                        <div>
                            <label>Full Name <span class="required">*</span></label>
                            <input name="fullName" required>
                        </div>
                        <div>
                            <label>Gender</label>
                            <div class="radio-row">
                                <label><input type="radio" name="gender" value="Male" required> Male</label>
                                <label><input type="radio" name="gender" value="Female"> Female</label>
                                <label><input type="radio" name="gender" value="Other"> Other</label>
                            </div>
                        </div>
                        <div>
                            <label>Date of Birth</label>
                            <input name="dateOfBirth" type="date" required>
                        </div>
                        <div>
                            <label>Phone</label>
                            <input name="phone" required>
                        </div>
                        <div>
                            <label>Employment Status</label>
                            <input name="status" readonly>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" id="editProfileButton">Cập nhật thông tin</button>
                        <button type="submit" id="submitProfileButton" class="hidden">Submit</button>
                        <button type="button" class="secondary hidden" id="discardProfileButton">Discard</button>
                    </div>
                </form>
            </div>
            <div id="employmentTab" class="tab-panel detail-grid hidden"></div>
            <div id="salaryTab" class="tab-panel detail-grid hidden"></div>
            <div id="accountTab" class="tab-panel detail-grid hidden"></div>
            <div id="documentsTab" class="tab-panel hidden">
                <form id="myDocumentForm" class="form-grid" enctype="multipart/form-data">
                    <div>
                        <label>Document Name</label>
                        <input name="documentName" required>
                    </div>
                    <div>
                        <label>Document Type</label>
                        <input name="documentType" placeholder="Contract, ID Card, Certificate...">
                    </div>
                    <div>
                        <label>Choose File</label>
                        <input name="file" type="file" accept=".pdf,.doc,.docx,.jpg,.png" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit">Upload Document</button>
                    </div>
                </form>
                <table>
                    <thead>
                    <tr>
                        <th>Document Name</th>
                        <th>Document Type</th>
                        <th>Uploaded Date</th>
                        <th>Uploaded By</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody id="myDocumentRows">
                    <tr><td colspan="5">No documents found.</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="historyTab" class="tab-panel hidden">
                <table>
                    <thead>
                    <tr>
                        <th>Date</th>
                        <th>Action</th>
                        <th>Changed By</th>
                        <th>Old Value</th>
                        <th>New Value</th>
                    </tr>
                    </thead>
                    <tbody id="profileHistoryRows"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="../js/employee.js"></script>
<script>
    document.querySelectorAll('.tab-button').forEach(button => {
        button.addEventListener('click', () => {
            document.querySelectorAll('.tab-button').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.add('hidden'));
            button.classList.add('active');
            document.querySelector(`#${button.dataset.tab}Tab`).classList.remove('hidden');
        });
    });
</script>
</body>
</html>
